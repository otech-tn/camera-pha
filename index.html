<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camera pha">
<title>Camera gắn nhãn pha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&display=swap">
<style>
  :root{
    --A:#f5c400; --B:#1f9d4c; --C:#d7261e;
    --bg:#0c0e11; --panel:#16191e; --line:#2a2f37; --fg:#f2f4f7; --muted:#9aa3ad;
    --cur:var(--A);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}

  /* Màn hình 1: chọn thiết bị */
  body.screen-home{background:#dcebfb}
  .home{flex:1;display:flex;flex-direction:column;gap:8px;padding:14px 12px 20px;min-height:0;overflow:auto;
    background:#dcebfb;font-family:'Be Vietnam Pro',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .logo{display:flex;justify-content:center}
  .logo img{width:200px;height:auto;display:block;opacity:.55}
  .groups{display:flex;flex-direction:column;gap:8px;padding-top:6px}
  .grp{background:#fff;border:2px solid #d93a33;border-radius:18px;padding:6px;display:flex;flex-wrap:wrap;gap:5px}
  .chip{flex:1 1 auto;min-height:34px;padding:3px 10px;background:#f6faf7;border:1px solid #e6efe9;border-radius:12px;
    display:flex;align-items:center;justify-content:center;text-align:center;color:#15703a;
    font-family:inherit;font-size:17px;font-weight:800;line-height:1.25}
  .chip:active{background:#dff0e4;border-color:#15703a}
  .home-foot{margin-top:auto;font-size:13px;font-weight:600;color:#1d3d63;text-align:center;min-height:18px}
  .cam{flex:1;display:flex;flex-direction:column;min-height:0}
  body.screen-home .cam{display:none}
  body:not(.screen-home) .home{display:none}

  /* Khung ngắm */
  .view{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  body.live video{display:block}
  .backbtn{position:absolute;left:12px;top:12px;z-index:3;width:42px;height:42px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;font-size:24px;line-height:42px;text-align:center;padding:0}
  .devname{align-self:flex-start;background:rgba(0,0,0,.55);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;
    max-width:calc(100vw - 190px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{position:absolute;left:64px;top:16px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;z-index:2;pointer-events:none}
  .lbl{color:#15703a;font-weight:800;font-size:23px;line-height:1.1;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0px 1px 0 #fff,0px -1px 0 #fff,1px 0px 0 #fff,-1px 0px 0 #fff}
  .lbl[hidden]{display:none}
  .clock{color:#d93a33;font-weight:700;font-size:15px;line-height:1.2;font-variant-numeric:tabular-nums;text-shadow:-0.75px -0.75px 0 #fff,0.75px -0.75px 0 #fff,-0.75px 0.75px 0 #fff,0.75px 0.75px 0 #fff,0px 0.75px 0 #fff,0px -0.75px 0 #fff,0.75px 0px 0 #fff,-0.75px 0px 0 #fff}
  .native-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;color:var(--muted);font-size:15px;line-height:1.45}
  body.live .native-hint{display:none}
  .big-letter{font-size:120px;font-weight:900;line-height:1;color:#fff}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  .flash.on{opacity:.75;transition:none}

  /* Điều khiển */
  .controls{background:#000;border-top:1px solid #1f2329;padding:10px 14px 18px;display:flex;flex-direction:column;gap:12px}
  .phases{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ph{height:34px;min-width:38px;padding:0 10px;border-radius:8px;font-size:17px;font-weight:800;
    border:1.5px solid #4a525c;color:#fff;background:transparent}
  .ph.sel{color:#f5c400}
  .saveall{height:44px;border-radius:10px;background:var(--fg);color:#111;font-weight:800;font-size:16px}
  .saveall[hidden]{display:none}
  .saveall:disabled{background:#262a31;color:var(--muted);opacity:1}
  .row{display:flex;justify-content:center;align-items:center}
  .shutter{width:76px;height:76px;border-radius:50%;border:5px solid #6b737d;background:#fff}
  .shutter:active{transform:scale(.94)}
  .thumb{position:absolute;right:14px;top:14px;z-index:3;width:52px;height:52px;border-radius:10px;border:2px solid #2a2f37;
    background:#4a525c center/cover no-repeat;color:#c9d0d7;display:flex;align-items:center;justify-content:center;padding:0}
  .thumb svg{display:none}
  .thumb.empty svg{display:block}
  .thumb .n{position:absolute;right:-7px;top:-7px;background:var(--fg);color:#111;font-weight:700;border-radius:10px;
    min-width:22px;height:22px;line-height:22px;font-size:13px;padding:0 5px}
  .thumb.empty .n{display:none}
  .thumb{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}

  /* Bảng */
  .sheet{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}
  .sheet.open{display:flex}
  #listSheet{display:flex;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
  #listSheet.open{transform:none;visibility:visible;transition:transform .25s ease}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .sheet-head h2{margin:0;font-size:17px}
  .x{font-size:26px;line-height:1;width:40px;height:40px;border-radius:50%;background:#222;flex:none}
  .preview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .preview img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
  .fname{font-size:13px;color:var(--muted);text-align:center;margin:10px 0;word-break:break-all}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{height:50px;border-radius:12px;font-weight:700;font-size:16px;background:#262a31}
  .btn.danger{background:#3a1c1c;color:#ffb4b0}
  .list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;margin-bottom:12px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .item img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#111}
  .item .meta{font-size:12px;padding:6px 8px;color:var(--muted);word-break:break-all;flex:1}
  .item button{margin:0 8px 8px;height:34px;border-radius:8px;background:#3a1c1c;color:#ffb4b0;font-size:14px;font-weight:600}
  .empty-list{color:var(--muted);text-align:center;padding:40px 10px;grid-column:1/-1}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 230px);transform:translateX(-50%);
    background:var(--fg);color:#111;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
</style>
</head>

    { id:'su-la-fco',     items:['SỨ ĐỨNG', 'CHỐNG SÉT VAN (LA)', 'FCO'] },
    { id:'mc-trung-the',  items:['MÁY CẮT TRUNG THẾ', 'DAO CẮT TẢI LBS', 'RECLOSER', 'DAO CÁCH LY', 'CÁP'] },
    { id:'mba-1-cuon-ha', items:['MBA khô', 'MBA cấp nguồn recloser', 'MBA dầu 1 cuộn hạ'] },
    { id:'mba-2-cuon-ha', items:['MBA 2 cuộn hạ'] },
    { id:'mc-ha-the',     items:['MÁY CẮT HẠ THẾ'] },
    { id:'thanh-cai',     items:['THANH CÁI'] }
  ];
  let device = null;

  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
    }
  } catch (e) {}

  const pad = n => String(n).padStart(2, '0');
  const fmtStamp = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const fmtFile = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;

  function toast(msg, ms) {
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 1400);
  }

  // phase = nhãn đang chọn ('A', 'B', 'C'...) hoặc null khi không chọn nút nào
  function setPhase(p) {
    phase = p || null;
    document.body.dataset.phase = phase || '';
    $('pill').textContent = phase || '';
    $('pill').hidden = !phase;
    document.querySelectorAll('.ph').forEach(b => {
      const on = b.dataset.p === phase;
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  function nextPhase() {
    if (!phase) return;                                  // không chọn nhãn thì giữ nguyên
    const i = ORDER.indexOf(phase);
    if (i >= 0) setPhase(ORDER[(i + 1) % ORDER.length]); // đang chọn A/B/C thì tự chuyển A→B→C
  }
  // Bấm nút để chọn, bấm lại nút đang chọn để bỏ chọn
  document.querySelectorAll('.ph').forEach(b => b.addEventListener('click', () => setPhase(phase === b.dataset.p ? null : b.dataset.p)));

  setInterval(() => { $('clock').textContent = fmtStamp(new Date()); }, 1000);
  $('clock').textContent = fmtStamp(new Date());

  // ---- Camera trực tiếp ----
  async function startLive() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      live = true;
      document.body.classList.add('live');
      return true;
    } catch (e) {
      live = false;
      document.body.classList.remove('live');
      return false;
    }
  }
  function stopLive() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; live = false; video.srcObject = null;
    document.body.classList.remove('live');
  }

  // ---- Chuyển màn hình ----
  function renderHome() {
    const list = $('homeList'); list.innerHTML = '';
    GROUPS.forEach(g => {
      const box = document.createElement('div'); box.className = 'grp';
      g.items.forEach(name => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = name;
        b.addEventListener('click', () => openDevice({ group:g.id, name }));
        box.appendChild(b);
      });
      list.appendChild(box);
    });
  }
  function showHome() {
    device = null;
    document.body.classList.add('screen-home');
    stopLive();
    $('homeFoot').textContent = shots.length ? `Còn ${shots.length} ảnh chưa lưu — mở lại một thiết bị để lưu` : '';
  }
  function openDevice(d) {
    device = d;
    document.body.classList.remove('screen-home');
    if (location.hash !== '#cam') location.hash = 'cam';   // để nút Back của điện thoại quay về màn hình 1
    startLive();
  }
  $('backBtn').addEventListener('click', () => {
    if (location.hash === '#cam') history.back(); else showHome();
  });
  window.addEventListener('hashchange', () => {
    if (location.hash !== '#cam' && !document.body.classList.contains('screen-home')) showHome();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && live && device) {
      const tr = stream && stream.getVideoTracks()[0];
      if (!tr || tr.readyState === 'ended') startLive();
    }
  });

  // ---- In nhãn ----
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  // Vẽ ngay (đồng bộ) để chụp đúng khung hình, mã hóa JPEG sau
  function stampCanvas(src, sw, sh, p, date) {
    const k = Math.min(1, MAX_SIDE / Math.max(sw, sh));
    const w = Math.round(sw * k), h = Math.round(sh * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0, w, h);

    // Giống màn hình: nhãn xanh lục (to gấp 1,5 lần ngày giờ), ngày giờ đỏ, viền trắng mỏng quanh chữ, không có khung
    const fD = Math.max(14, Math.round(Math.min(w, h) * 0.045));   // cỡ chữ ngày giờ
    const fL = Math.round(fD * 1.5);                                // cỡ chữ nhãn
    const m = Math.round(fD * 0.9);                                 // lề
    const t2 = fmtStamp(date);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
    const draw = (txt, size, weight, color, yBase) => {
      g.font = `${weight} ${size}px ${FONT}`;
      g.strokeStyle = '#ffffff'; g.lineWidth = Math.max(2, size * 0.09);
      g.strokeText(txt, m, yBase);
      g.fillStyle = color; g.fillText(txt, m, yBase);
    };
    const yDate = h - m;
    draw(t2, fD, 700, '#d93a33', yDate);
    if (p) draw(p, fL, 800, '#15703a', yDate - fD * 1.25);
    return c;
  }

  function uniqueName(p, date) {
    const tag = !p ? 'Anh' : (ORDER.includes(p) ? 'Pha' + p : String(p).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9]+/g, '-'));
    let base = `${tag}_${fmtFile(date)}`, name = base + '.jpg', i = 2;
    while (shots.some(s => s.name === name)) name = `${base}_${i++}.jpg`;
    return name;
  }

  function addShot(src, sw, sh, date) {
    const p = phase;
    const canvas = stampCanvas(src, sw, sh, p, date);
    const shot = { phase: p, date, name: uniqueName(p, date), blob: null, url: null, device: device ? device.name : '' };
    shot.ready = new Promise(res => canvas.toBlob(b => {
      shot.blob = b; shot.url = b ? URL.createObjectURL(b) : null; refresh(); res(b);
    }, 'image/jpeg', 0.92));
    shots.push(shot);
    nextPhase();
    refresh();
    toast(p ? `Đã chụp ${p}` : 'Đã chụp');
  }

  // ---- Chụp ----
  $('shutter').addEventListener('click', () => {
    if (live && video.videoWidth) {
      const f = $('flash'); f.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
      addShot(video, video.videoWidth, video.videoHeight, new Date());
    } else {
      fileInput.value = '';
      fileInput.click();
    }
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const date = new Date(file.lastModified || Date.now());
    const url = URL.createObjectURL(file);
    const img = new Image(); img.src = url;
    try { await img.decode(); } catch (e) { URL.revokeObjectURL(url); toast('Không đọc được ảnh'); return; }
    addShot(img, img.naturalWidth, img.naturalHeight, date);
    URL.revokeObjectURL(url);
  });

  // ---- Lưu cả loạt ----
  function clearSaved(list) {
    list.forEach(s => { if (s.url) URL.revokeObjectURL(s.url); });
    shots = shots.filter(s => !list.includes(s));
    refresh();
  }

  async function saveAll() {
    if (saving || !shots.length) return;
    const batch = shots.slice();
    // Ảnh vừa chụp thường đã mã hóa xong; nếu chưa thì báo đợi chút
    if (batch.some(s => !s.blob)) { toast('Đang xử lý ảnh, bấm lại sau 1 giây'); return; }
    const files = batch.map(s => new File([s.blob], s.name, { type: 'image/jpeg' }));

    // 1) Chia sẻ một lần cả loạt (iPhone/Android trên trình duyệt thường) → "Lưu N hình ảnh"
    let canShare = false;
    try { canShare = !!(navigator.canShare && navigator.canShare({ files })); } catch (e) {}
    if (canShare) {
      saving = true;
      try {
        await navigator.share({ files });
        clearSaved(batch);
        toast(`Đã lưu ${batch.length} ảnh`, 2000);
      } catch (e) {
        if (!(e && e.name === 'AbortError')) toast('Không lưu được: ' + ((e && e.message) || e));
      } finally { saving = false; }
      return;
    }

    // 2) Trong Claude: lưu từng ảnh (mỗi ảnh một lần xác nhận)
    if (downloads) {
      saving = true;
      const done = [];
      try {
        for (const s of batch) {
          try { await downloads.save({ filename: s.name, data: s.blob }); done.push(s); }
          catch (e) {
            const code = e && e.code;
            if (code === 'declined') break;
            if (code === 'rate_limited') { toast('Đang có hộp thoại lưu, thử lại sau'); break; }
            toast('Không lưu được: ' + ((e && e.message) || code)); break;
          }
        }
      } finally { saving = false; }
      if (done.length) { clearSaved(done); toast(`Đã lưu ${done.length} ảnh`, 2000); }
      return;
    }

    // 3) Trình duyệt không chia sẻ được file (máy tính, Android cũ): tải xuống từng file
    for (const s of batch) {
      const a = document.createElement('a'); a.href = s.url; a.download = s.name;
      document.body.appendChild(a); a.click(); a.remove();
      await new Promise(r => setTimeout(r, 250));
    }
    clearSaved(batch);
    toast(`Đã tải ${batch.length} ảnh về thư mục Tải xuống`, 2200);
  }
  $('saveAll2').addEventListener('click', () => { $('listSheet').classList.remove('open'); saveAll(); });

  // ---- Giao diện ----
  function refresh() {
    const n = shots.length;
    $('count').textContent = n;
    const t = $('thumbBtn');
    t.classList.toggle('empty', !n);
    const last = shots[n - 1];
    t.style.backgroundImage = last && last.url ? `url("${last.url}")` : '';
    $('saveAll2').disabled = !n;
    $('saveAll2').textContent = n ? `Lưu ${n} ảnh vào máy` : 'Chưa có ảnh để lưu';
    t.setAttribute('aria-label', n ? `Lưu ${n} ảnh vào máy (giữ lâu để xem, xóa)` : 'Chưa có ảnh');
    $('listTitle').textContent = `Ảnh chưa lưu (${n})`;
    if ($('listSheet').classList.contains('open')) renderList();
  }

  function renderList() {
    const el = $('list'); el.innerHTML = '';
    if (!shots.length) { el.innerHTML = '<div class="empty-list">Chưa có ảnh nào.</div>'; return; }
    shots.slice().reverse().forEach(s => {
      const d = document.createElement('div'); d.className = 'item';
      const img = document.createElement('img'); if (s.url) img.src = s.url; img.alt = s.name;
      img.addEventListener('click', () => openShot(s));
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = s.name;
      const b = document.createElement('button'); b.textContent = 'Xóa';
      b.addEventListener('click', () => removeShot(s));
      d.append(img, meta, b); el.appendChild(d);
    });
  }
  function removeShot(s) {
    if (s.url) URL.revokeObjectURL(s.url);
    shots = shots.filter(x => x !== s);
    refresh();
  }
  function openShot(s) {
    viewing = s;
    $('shotTitle').textContent = s.phase ? s.phase : 'Ảnh không nhãn';
    $('shotImg').src = s.url || '';
    $('shotName').textContent = s.name;
    $('shotSheet').classList.add('open');
  }
  let pressTimer = null, longPressed = false;
  const thumb = $('thumbBtn');
  const openList = () => { renderList(); $('listSheet').classList.add('open'); };
  thumb.addEventListener('pointerdown', () => {
    longPressed = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => { longPressed = true; if (shots.length) openList(); }, 550);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => thumb.addEventListener(ev, () => clearTimeout(pressTimer)));
  thumb.addEventListener('contextmenu', e => e.preventDefault());
  thumb.addEventListener('click', () => {
    if (longPressed) { longPressed = false; return; }
    if (!shots.length) { toast('Chưa có ảnh nào'); return; }
    saveAll();
  });
  $('listClose').addEventListener('click', () => $('listSheet').classList.remove('open'));

  // Vuốt từ phải sang trái trên màn hình camera: mở danh sách ảnh chưa lưu; vuốt sang phải trên danh sách: đóng
  function onSwipe(el, fn) {
    let sx = 0, sy = 0, st = 0, on = false;
    el.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); on = e.touches.length === 1; }, { passive:true });
    el.addEventListener('touchend', e => {
      if (!on) return; on = false;
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Date.now() - st < 700 && Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx) * 0.6) fn(dx < 0 ? 'left' : 'right');
    }, { passive:true });
  }
  onSwipe($('view'), dir => { if (dir === 'left') openList(); });
  onSwipe($('listSheet'), dir => { if (dir === 'right') $('listSheet').classList.remove('open'); });
  $('shotClose').addEventListener('click', () => { $('shotSheet').classList.remove('open'); $('listSheet').classList.remove('open'); });
  $('backList').addEventListener('click', () => $('shotSheet').classList.remove('open'));
  $('delOne').addEventListener('click', () => { if (viewing) removeShot(viewing); viewing = null; $('shotSheet').classList.remove('open'); });

  window.addEventListener('beforeunload', e => { if (shots.length) { e.preventDefault(); e.returnValue = ''; } });

  setPhase('A');
  refresh();
  renderHome();
  if (location.hash === '#cam') location.hash = '';
  showHome();
})();
</script>
</body>
</html>

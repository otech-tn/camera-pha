<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camera pha">
<title>Camera gắn nhãn pha</title>
<style>
  :root{
    --A:#f5c400; --B:#1f9d4c; --C:#d7261e;
    --bg:#0c0e11; --panel:#16191e; --line:#2a2f37; --fg:#f2f4f7; --muted:#9aa3ad;
    --cur:var(--A);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}

  /* Màn hình 1: chọn thiết bị */
  .home{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 14px 16px;min-height:0}
  .home-head{font-size:15px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.3px}
  .home-list{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
  .dev{flex:1 1 0;min-height:64px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);
    font-size:17px;font-weight:700;line-height:1.35;padding:12px 16px;text-align:center;
    display:flex;align-items:center;justify-content:center}
  .dev:active{background:#232830;border-color:var(--fg)}
  .home-foot{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
  .cam{flex:1;display:flex;flex-direction:column;min-height:0}
  body.screen-home .cam{display:none}
  body:not(.screen-home) .home{display:none}

  /* Khung ngắm */
  .view{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  body.live video{display:block}
  .backbtn{position:absolute;left:12px;top:12px;z-index:3;width:42px;height:42px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;font-size:24px;line-height:42px;text-align:center;padding:0}
  .devname{align-self:flex-start;background:rgba(0,0,0,.55);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;
    max-width:calc(100vw - 190px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{position:absolute;left:64px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2;pointer-events:none}
  .pill{align-self:flex-start;background:var(--cur);color:#fff;font-weight:800;font-size:30px;letter-spacing:.5px;
    padding:6px 16px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  body[data-phase="A"] .pill{color:#111}
  .clock{align-self:flex-start;background:rgba(0,0,0,.55);font-weight:600;font-size:15px;padding:4px 10px;border-radius:8px;
    font-variant-numeric:tabular-nums}
  .pending{position:absolute;right:14px;top:14px;z-index:2;background:rgba(0,0,0,.6);border-radius:10px;padding:6px 12px;
    font-weight:700;font-size:15px;pointer-events:none}
  .pending b{font-size:22px;font-variant-numeric:tabular-nums}
  .native-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;color:var(--muted);font-size:15px;line-height:1.45}
  body.live .native-hint{display:none}
  .big-letter{font-size:150px;font-weight:900;line-height:1;color:var(--cur)}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  .flash.on{opacity:.75;transition:none}

  /* Điều khiển */
  .controls{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:12px}
  .phases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ph{height:54px;border-radius:12px;font-size:24px;font-weight:800;border:2px solid var(--c);color:var(--c);background:transparent}
  .ph[data-p="A"]{--c:var(--A)} .ph[data-p="B"]{--c:var(--B)} .ph[data-p="C"]{--c:var(--C)}
  .ph.sel{background:var(--c);color:#fff}
  .ph[data-p="A"].sel{color:#111}
  .saveall{height:52px;border-radius:12px;background:var(--fg);color:#111;font-weight:800;font-size:17px}
  .saveall:disabled{background:#262a31;color:var(--muted);opacity:1}
  .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--cur);
    box-shadow:0 0 0 3px rgba(255,255,255,.12);justify-self:center}
  .shutter:active{transform:scale(.94)}
  .thumb{justify-self:start;width:52px;height:52px;border-radius:10px;border:2px solid var(--line);background:#000 center/cover no-repeat;
    position:relative}
  .thumb .n{position:absolute;right:-7px;top:-7px;background:var(--fg);color:#111;font-weight:700;border-radius:10px;
    min-width:22px;height:22px;line-height:22px;font-size:13px;padding:0 5px}
  .thumb.empty .n{display:none}
  .auto{justify-self:end;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);user-select:none}
  .auto input{width:20px;height:20px;accent-color:var(--fg)}

  /* Bảng */
  .sheet{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}
  .sheet.open{display:flex}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .sheet-head h2{margin:0;font-size:17px}
  .x{font-size:26px;line-height:1;width:40px;height:40px;border-radius:50%;background:#222;flex:none}
  .preview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .preview img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
  .fname{font-size:13px;color:var(--muted);text-align:center;margin:10px 0;word-break:break-all}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{height:50px;border-radius:12px;font-weight:700;font-size:16px;background:#262a31}
  .btn.danger{background:#3a1c1c;color:#ffb4b0}
  .list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;margin-bottom:12px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .item img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#111}
  .item .meta{font-size:12px;padding:6px 8px;color:var(--muted);word-break:break-all;flex:1}
  .item button{margin:0 8px 8px;height:34px;border-radius:8px;background:#3a1c1c;color:#ffb4b0;font-size:14px;font-weight:600}
  .empty-list{color:var(--muted);text-align:center;padding:40px 10px;grid-column:1/-1}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 230px);transform:translateX(-50%);
    background:var(--fg);color:#111;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
</style>
</head>
<body data-phase="A" class="screen-home">

<!-- Màn hình 1: chọn thiết bị -->
<div class="home" id="home">
  <div class="home-head">CHỌN THIẾT BỊ</div>
  <div class="home-list" id="homeList"></div>
  <div class="home-foot" id="homeFoot"></div>
</div>

<!-- Màn hình 2: camera -->
<div class="cam" id="cam">
<div class="view" id="view">
  <video id="video" playsinline muted autoplay></video>
  <button class="backbtn" id="backBtn" aria-label="Đổi thiết bị">←</button>
  <div class="badge"><div class="pill" id="pill">PHA A</div><div class="clock" id="clock">--</div><div class="devname" id="devName"></div></div>
  <div class="pending">Chưa lưu: <b id="pendingN">0</b></div>
  <div class="native-hint" id="hint">
    <div class="big-letter" id="bigLetter">A</div>
    <div>Chọn pha bên dưới, rồi bấm nút tròn để mở camera.<br>Nhãn pha và ngày giờ được in lên ảnh ngay sau khi chụp.</div>
  </div>
  <div class="flash" id="flash"></div>
</div>

<div class="controls">
  <div class="phases">
    <button class="ph sel" data-p="A">A</button>
    <button class="ph" data-p="B">B</button>
    <button class="ph" data-p="C">C</button>
  </div>
  <button class="saveall" id="saveAll" disabled>Chưa có ảnh để lưu</button>
  <div class="row">
    <button class="thumb empty" id="thumbBtn" aria-label="Xem ảnh chưa lưu"><span class="n" id="count">0</span></button>
    <button class="shutter" id="shutter" aria-label="Chụp"></button>
    <label class="auto"><input type="checkbox" id="auto" checked>Tự chuyển<br>A→B→C</label>
  </div>
</div>
</div>

<input type="file" id="file" accept="image/*" capture="environment" hidden>

<!-- Danh sách ảnh chưa lưu -->
<div class="sheet" id="listSheet">
  <div class="sheet-head"><h2 id="listTitle">Ảnh chưa lưu</h2><button class="x" id="listClose" aria-label="Đóng">×</button></div>
  <div class="list" id="list"></div>
  <button class="saveall" id="saveAll2">Lưu</button>
</div>

<!-- Xem một ảnh -->
<div class="sheet" id="shotSheet">
  <div class="sheet-head"><h2 id="shotTitle">Ảnh</h2><button class="x" id="shotClose" aria-label="Đóng">×</button></div>
  <div class="preview"><img id="shotImg" alt="Ảnh đã gắn nhãn"></div>
  <div class="fname" id="shotName"></div>
  <div class="btns">
    <button class="btn danger" id="delOne">Xóa ảnh này</button>
    <button class="btn" id="backList">Quay lại</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const COLORS = { A: '#f5c400', B: '#1f9d4c', C: '#d7261e' };
  const TEXT_ON = { A: '#111111', B: '#ffffff', C: '#ffffff' };
  const ORDER = ['A', 'B', 'C'];
  const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  const MAX_SIDE = 4096;

  const $ = id => document.getElementById(id);
  const video = $('video'), fileInput = $('file');
  let phase = 'A', live = false, stream = null, downloads = null, viewing = null, saving = false;
  let shots = [];   // ảnh chưa lưu: {phase, date, name, blob, url, device}

  // Danh sách thiết bị ở màn hình 1
  const DEVICES = [
    { id:'su-la-fco',   name:'SỨ ĐỨNG – CHỐNG SÉT VAN (LA) - FCO' },
    { id:'mc-trung-the', name:'MÁY CẮT TRUNG THẾ - DAO CẮT TẢI LBS - RECLOSER - DAO CÁCH LY - CÁP' },
    { id:'mba-1-cuon-ha', name:'MBA khô - MBA cấp nguồn recloser - MBA dầu 1 cuộn hạ' },
    { id:'mba-2-cuon-ha', name:'MBA 2 cuộn hạ' },
    { id:'mc-ha-the',   name:'MÁY CẮT HẠ THẾ' },
    { id:'thanh-cai',   name:'THANH CÁI' }
  ];
  let device = null;

  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
    }
  } catch (e) {}

  const pad = n => String(n).padStart(2, '0');
  const fmtStamp = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const fmtFile = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;

  function toast(msg, ms) {
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 1400);
  }

  function setPhase(p) {
    phase = p;
    document.body.dataset.phase = p;
    document.documentElement.style.setProperty('--cur', COLORS[p]);
    $('pill').textContent = 'PHA ' + p;
    $('bigLetter').textContent = p;
    document.querySelectorAll('.ph').forEach(b => b.classList.toggle('sel', b.dataset.p === p));
  }
  function nextPhase() {
    if ($('auto').checked) setPhase(ORDER[(ORDER.indexOf(phase) + 1) % 3]);
  }
  document.querySelectorAll('.ph').forEach(b => b.addEventListener('click', () => setPhase(b.dataset.p)));

  setInterval(() => { $('clock').textContent = fmtStamp(new Date()); }, 1000);
  $('clock').textContent = fmtStamp(new Date());

  // ---- Camera trực tiếp ----
  async function startLive() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      live = true;
      document.body.classList.add('live');
      return true;
    } catch (e) {
      live = false;
      document.body.classList.remove('live');
      return false;
    }
  }
  function stopLive() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; live = false; video.srcObject = null;
    document.body.classList.remove('live');
  }

  // ---- Chuyển màn hình ----
  function renderHome() {
    const list = $('homeList'); list.innerHTML = '';
    DEVICES.forEach(d => {
      const b = document.createElement('button');
      b.className = 'dev'; b.textContent = d.name;
      b.addEventListener('click', () => openDevice(d));
      list.appendChild(b);
    });
  }
  function showHome() {
    device = null;
    document.body.classList.add('screen-home');
    stopLive();
    $('homeFoot').textContent = shots.length ? `Còn ${shots.length} ảnh chưa lưu — mở lại một thiết bị để lưu` : '';
  }
  function openDevice(d) {
    device = d;
    $('devName').textContent = d.name;
    document.body.classList.remove('screen-home');
    if (location.hash !== '#cam') location.hash = 'cam';   // để nút Back của điện thoại quay về màn hình 1
    startLive();
  }
  $('backBtn').addEventListener('click', () => {
    if (location.hash === '#cam') history.back(); else showHome();
  });
  window.addEventListener('hashchange', () => {
    if (location.hash !== '#cam' && !document.body.classList.contains('screen-home')) showHome();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && live && device) {
      const tr = stream && stream.getVideoTracks()[0];
      if (!tr || tr.readyState === 'ended') startLive();
    }
  });

  // ---- In nhãn ----
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  // Vẽ ngay (đồng bộ) để chụp đúng khung hình, mã hóa JPEG sau
  function stampCanvas(src, sw, sh, p, date) {
    const k = Math.min(1, MAX_SIDE / Math.max(sw, sh));
    const w = Math.round(sw * k), h = Math.round(sh * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0, w, h);

    const u = Math.max(16, Math.round(Math.min(w, h) * 0.05));
    const padd = Math.round(u * 0.55), m = Math.round(u * 0.7);
    const t1 = 'PHA ' + p, t2 = fmtStamp(date);
    const f1 = `800 ${Math.round(u * 1.6)}px ${FONT}`, f2 = `600 ${u}px ${FONT}`;
    g.font = f1; const w1 = g.measureText(t1).width;
    g.font = f2; const w2 = g.measureText(t2).width;
    const pillW = w1 + padd * 2, pillH = Math.round(u * 2.1), lineH = Math.round(u * 1.4);
    const boxW = Math.max(pillW, w2) + padd * 2;
    const boxH = padd + pillH + Math.round(padd * 0.5) + lineH + Math.round(padd * 0.5);
    const x = m, y = h - m - boxH;

    g.fillStyle = 'rgba(0,0,0,0.62)'; rr(g, x, y, boxW, boxH, u * 0.35); g.fill();
    g.fillStyle = COLORS[p]; rr(g, x + padd, y + padd, pillW, pillH, u * 0.3); g.fill();
    g.textBaseline = 'middle'; g.textAlign = 'left';
    g.font = f1; g.fillStyle = TEXT_ON[p];
    g.fillText(t1, x + padd * 2, y + padd + pillH / 2 + u * 0.05);
    g.font = f2; g.fillStyle = '#ffffff';
    g.fillText(t2, x + padd, y + padd + pillH + Math.round(padd * 0.5) + lineH / 2);
    return c;
  }

  function uniqueName(p, date) {
    let base = `Pha${p}_${fmtFile(date)}`, name = base + '.jpg', i = 2;
    while (shots.some(s => s.name === name)) name = `${base}_${i++}.jpg`;
    return name;
  }

  function addShot(src, sw, sh, date) {
    const p = phase;
    const canvas = stampCanvas(src, sw, sh, p, date);
    const shot = { phase: p, date, name: uniqueName(p, date), blob: null, url: null, device: device ? device.name : '' };
    shot.ready = new Promise(res => canvas.toBlob(b => {
      shot.blob = b; shot.url = b ? URL.createObjectURL(b) : null; refresh(); res(b);
    }, 'image/jpeg', 0.92));
    shots.push(shot);
    nextPhase();
    refresh();
    toast(`Đã chụp Pha ${p} · chưa lưu ${shots.length} ảnh`);
  }

  // ---- Chụp ----
  $('shutter').addEventListener('click', () => {
    if (live && video.videoWidth) {
      const f = $('flash'); f.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
      addShot(video, video.videoWidth, video.videoHeight, new Date());
    } else {
      fileInput.value = '';
      fileInput.click();
    }
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const date = new Date(file.lastModified || Date.now());
    const url = URL.createObjectURL(file);
    const img = new Image(); img.src = url;
    try { await img.decode(); } catch (e) { URL.revokeObjectURL(url); toast('Không đọc được ảnh'); return; }
    addShot(img, img.naturalWidth, img.naturalHeight, date);
    URL.revokeObjectURL(url);
  });

  // ---- Lưu cả loạt ----
  function clearSaved(list) {
    list.forEach(s => { if (s.url) URL.revokeObjectURL(s.url); });
    shots = shots.filter(s => !list.includes(s));
    refresh();
  }

  async function saveAll() {
    if (saving || !shots.length) return;
    const batch = shots.slice();
    // Ảnh vừa chụp thường đã mã hóa xong; nếu chưa thì báo đợi chút
    if (batch.some(s => !s.blob)) { toast('Đang xử lý ảnh, bấm lại sau 1 giây'); return; }
    const files = batch.map(s => new File([s.blob], s.name, { type: 'image/jpeg' }));

    // 1) Chia sẻ một lần cả loạt (iPhone/Android trên trình duyệt thường) → "Lưu N hình ảnh"
    let canShare = false;
    try { canShare = !!(navigator.canShare && navigator.canShare({ files })); } catch (e) {}
    if (canShare) {
      saving = true;
      try {
        await navigator.share({ files });
        clearSaved(batch);
        toast(`Đã lưu ${batch.length} ảnh · bắt đầu lại từ 0`, 2200);
      } catch (e) {
        if (!(e && e.name === 'AbortError')) toast('Không lưu được: ' + ((e && e.message) || e));
      } finally { saving = false; }
      return;
    }

    // 2) Trong Claude: lưu từng ảnh (mỗi ảnh một lần xác nhận)
    if (downloads) {
      saving = true;
      const done = [];
      try {
        for (const s of batch) {
          try { await downloads.save({ filename: s.name, data: s.blob }); done.push(s); }
          catch (e) {
            const code = e && e.code;
            if (code === 'declined') break;
            if (code === 'rate_limited') { toast('Đang có hộp thoại lưu, thử lại sau'); break; }
            toast('Không lưu được: ' + ((e && e.message) || code)); break;
          }
        }
      } finally { saving = false; }
      if (done.length) { clearSaved(done); toast(`Đã lưu ${done.length} ảnh`, 2000); }
      return;
    }

    // 3) Trình duyệt không chia sẻ được file (máy tính, Android cũ): tải xuống từng file
    for (const s of batch) {
      const a = document.createElement('a'); a.href = s.url; a.download = s.name;
      document.body.appendChild(a); a.click(); a.remove();
      await new Promise(r => setTimeout(r, 250));
    }
    clearSaved(batch);
    toast(`Đã tải ${batch.length} ảnh về thư mục Tải xuống`, 2200);
  }
  $('saveAll').addEventListener('click', saveAll);
  $('saveAll2').addEventListener('click', () => { $('listSheet').classList.remove('open'); saveAll(); });

  // ---- Giao diện ----
  function refresh() {
    const n = shots.length;
    $('pendingN').textContent = n;
    $('count').textContent = n;
    const t = $('thumbBtn');
    t.classList.toggle('empty', !n);
    const last = shots[n - 1];
    t.style.backgroundImage = last && last.url ? `url("${last.url}")` : '';
    for (const id of ['saveAll', 'saveAll2']) {
      $(id).disabled = !n;
      $(id).textContent = n ? `Lưu ${n} ảnh vào máy` : 'Chưa có ảnh để lưu';
    }
    $('listTitle').textContent = `Ảnh chưa lưu (${n})`;
    if ($('listSheet').classList.contains('open')) renderList();
  }

  function renderList() {
    const el = $('list'); el.innerHTML = '';
    if (!shots.length) { el.innerHTML = '<div class="empty-list">Chưa có ảnh nào.</div>'; return; }
    shots.slice().reverse().forEach(s => {
      const d = document.createElement('div'); d.className = 'item';
      const img = document.createElement('img'); if (s.url) img.src = s.url; img.alt = s.name;
      img.addEventListener('click', () => openShot(s));
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = s.name;
      const b = document.createElement('button'); b.textContent = 'Xóa';
      b.addEventListener('click', () => removeShot(s));
      d.append(img, meta, b); el.appendChild(d);
    });
  }
  function removeShot(s) {
    if (s.url) URL.revokeObjectURL(s.url);
    shots = shots.filter(x => x !== s);
    refresh();
  }
  function openShot(s) {
    viewing = s;
    $('shotTitle').textContent = 'Pha ' + s.phase;
    $('shotImg').src = s.url || '';
    $('shotName').textContent = s.name;
    $('shotSheet').classList.add('open');
  }
  $('thumbBtn').addEventListener('click', () => { renderList(); $('listSheet').classList.add('open'); });
  $('listClose').addEventListener('click', () => $('listSheet').classList.remove('open'));
  $('shotClose').addEventListener('click', () => { $('shotSheet').classList.remove('open'); $('listSheet').classList.remove('open'); });
  $('backList').addEventListener('click', () => $('shotSheet').classList.remove('open'));
  $('delOne').addEventListener('click', () => { if (viewing) removeShot(viewing); viewing = null; $('shotSheet').classList.remove('open'); });

  window.addEventListener('beforeunload', e => { if (shots.length) { e.preventDefault(); e.returnValue = ''; } });

  setPhase('A');
  refresh();
  renderHome();
  if (location.hash === '#cam') location.hash = '';
  showHome();
})();
</script>
</body>
</html>
